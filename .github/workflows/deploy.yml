name: deploy-to-mikrus

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MIKRUS_HOST }}
          username: ${{ secrets.MIKRUS_USER }}
          key: ${{ secrets.MIKRUS_SSH_KEY }}
          port: 20212
          script: |
            set -euo pipefail

            mkdir -p /opt/events

            REPO_DIR=/opt/events/kafka-infra
            ENV_FILE=/opt/events/.env
            COMPOSE_FILE=infra/docker-compose.mikrus.yml

            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              git clone --depth 1 https://github.com/JanJankowski-dev/kafka-infra "$REPO_DIR"
            fi

            git -C "$REPO_DIR" fetch --depth 1 origin main
            git -C "$REPO_DIR" reset --hard origin/main

            docker compose --env-file "$ENV_FILE" -f "$REPO_DIR/$COMPOSE_FILE" pull

            docker compose --env-file "$ENV_FILE" -f "$REPO_DIR/$COMPOSE_FILE" up -d --remove-orphans

            docker image prune -f

name: deploy-to-mikrus

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MIKRUS_HOST }}
          username: ${{ secrets.MIKRUS_USER }}
          key: ${{ secrets.MIKRUS_SSH_KEY }}
          port: 20212
          script: |
            set -euo pipefail
  
            mkdir -p /opt/events
            cd /opt/events
            
            if [ ! -d "kafka-infra/.git" ]; then
            rm -rf kafka-infra
            git clone --depth 1 https://github.com/JanJankowski-dev/kafka-infra kafka-infra
            fi
            
            cd kafka-infra
            
            git fetch --depth 1 origin main
            git reset --hard origin/main
            
            docker compose --env-file .env -f docker-compose.mikrus.yml pull
            docker compose --env-file .env -f docker-compose.mikrus.yml up -d --remove-orphans
            docker image prune -f
